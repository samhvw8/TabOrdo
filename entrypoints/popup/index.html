<!DOCTYPE html>
<html lang="en" style="width: 450px; height: 600px; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabOrdo</title>
    <style>
      /* Shown from `load` until main.ts mounts the app. Fades in late, so a normal open, where
         the app replaces it within a frame or two, does not flash it. */
      #boot { display: flex; height: 100%; align-items: center; justify-content: center;
              color: #9999b0; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
              opacity: 0; animation: boot-in 0s 150ms forwards; }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
  </head>
  <body style="width: 450px; height: 600px; overflow: hidden; margin: 0; background: #1e1e2e;">
    <div id="app" style="width: 450px; height: 600px; overflow: hidden;"><div id="boot">Loading TabOrdo…</div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
