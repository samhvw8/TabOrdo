name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run zip

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: tab-ordo-chrome
          path: .output/*.zip
          # `.output` is a dotted directory, and upload-artifact treats everything under one as
          # hidden. Without this the step found no files and warned rather than failed, so every
          # build on main has silently uploaded nothing.
          include-hidden-files: true
          retention-days: 30
