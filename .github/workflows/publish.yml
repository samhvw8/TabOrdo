name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node comes from mise.toml, the same pin local dev uses, so CI and a checkout never differ.
      - uses: jdx/mise-action@v4

      - run: npm ci

      # Gate the submission on its own checks. build.yml runs these too, but it triggers on
      # push to main and nothing makes a release wait for it — without this, publishing can
      # ship a build that build.yml is about to fail.
      - run: npm run check

      - run: npm test

      - run: npm run zip

      - name: Submit to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
